# Single CI job. It runs `make check` and nothing else: the Makefile is the one
# place where build logic lives, so CI and a laptop cannot drift apart.
#
# Every third-party action is pinned to a full commit SHA. A tag is mutable and
# can be repointed at new code by whoever owns the action; a SHA cannot.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        # No arguments: rustup reads rust-toolchain.toml, which is the single
        # source of truth for the version, components and targets.
        run: |
          rustup toolchain install
          rustup show
          cargo --version

      - name: Cache cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: make check
        run: make check
