[workspace]
resolver = "3"
# `pochoir-wasm` must be listed here. ADR-0004 Decision 1, constraint 1: a path
# dependency on `pochoir-core` from a crate outside this workspace root puts an
# absolute path into `-Cmetadata`, which renames every symbol and destroys build
# reproducibility with nothing in the output to say so.
members = ["crates/pochoir-core", "crates/pochoir-cli", "crates/pochoir-wasm"]

# Shared metadata. Both crates inherit these with `field.workspace = true`.
[workspace.package]
edition = "2024"
rust-version = "1.97"
authors = ["Samuel Bagattin"]
# These crates are the permissive half of the split described in LICENSE.md:
# the engine and CLI are `MIT OR Apache-2.0` so integrators can use them, while
# the web application and site are AGPL-3.0-or-later. Decided 2026-11-26.
license = "MIT OR Apache-2.0"
repository = "https://github.com/SamuelBagattin/pochoir"

[profile.release]
# The wasm artefact is shipped to browsers, so optimise it for size.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
